# Sample nginx config for ID card authentication
# Place in /etc/nginx/sites-available/opetaja-tagasiside
#
# Requires:
#   - Your TLS certificate and key
#   - Estonian ID-card CA bundle (download from https://www.sk.ee/en/resources/certificates/)
#     Typically: ESTEID-SK 2015, ESTEID-SK 2018, EID-SK 2016, etc.
#
# After editing, enable with:
#   ln -s /etc/nginx/sites-available/opetaja-tagasiside /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 443 ssl;
    server_name opetajatagasiside.ee;

    ssl_certificate /path/to/cert.pem;
    ssl_certificate_key /path/to/key.pem;

    # Estonian ID card CA certificates
    ssl_client_certificate /path/to/esteid-ca-bundle.pem;
    ssl_verify_client optional;
    ssl_verify_depth 2;

    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass ID-card certificate info to the Next.js app
        proxy_set_header SSL_CLIENT_S_DN $ssl_client_s_dn;
        proxy_set_header SSL_CLIENT_VERIFY $ssl_client_verify;
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name opetajatagasiside.ee;
    return 301 https://$host$request_uri;
}
